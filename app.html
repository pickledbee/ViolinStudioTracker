/* ---------------- PASTE FROM CLAUDE ----------------
   Claude turns a plain-English day summary into one JSON block like:
   {"studioLog":1,"date":"2026-10-12",
    "lessons":[{"student":"Nora","status":"Attended","charge":25,"makeup":false,"notes":""}],
    "payments":[{"student":"Theo","amount":50,"method":"Venmo","for":"October","date":"2026-10-12","notes":""}],
    "notes":[{"student":"Nora","piece":"Minuet 1","workedOn":"...","practice":"...","notes":""}],
    "charges":[{"student":"Kai","description":"Book 2","amount":12,"date":""}],
    "makeups":[{"student":"June","status":"Scheduled","missedDate":"2026-10-05","scheduledDate":"2026-10-15","scheduledTime":"4:00 PM","reason":"","notes":""}],
    "students":[{"name":"New Kid","parent":"","phone":"","email":"","rate":25,"billing":"Per Lesson"}]}
   status is one of: Attended, Canceled by Student, Canceled by Teacher, No-Show, Make-Up Lesson.
   Omit "charge" to use the student's normal rate rules. */
let IMPORT = null;
function findStudentByName(name){
  const n = String(name||'').trim().toLowerCase();
  if(!n) return null;
  const all = rows('Students');
  let hit = all.filter(s => String(s['Student Name']).trim().toLowerCase() === n);
  if(hit.length === 1) return hit[0];
  hit = all.filter(s => String(s['Student Name']).trim().toLowerCase().startsWith(n) || n.startsWith(String(s['Student Name']).trim().toLowerCase().split(' ')[0]));
  return hit.length === 1 ? hit[0] : null;
}
function importForm(){
  IMPORT = null;
  openModal('<h2>Paste from Claude</h2><p class="help">Tell Claude what you did today (who you taught, who canceled, who paid, what each student worked on). Claude replies with a block of text. Copy that whole block and paste it here.</p>' +
    '<textarea id="importText" style="min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:12px" placeholder=\'{"studioLog":1, ...}\'></textarea>' +
    '<div id="importPreview"></div>' +
    '<div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn" data-act="importCheck">Check it</button><button class="btn primary" data-act="importSave" id="importSaveBtn" disabled>Save all</button></div>');
  setTimeout(()=>{ const el = $('#importText'); if(el) el.focus(); }, 50);
}
function importCheck(){
  const raw = $('#importText').value.trim();
  const start = raw.indexOf('{'), end = raw.lastIndexOf('}');
  let log;
  try{ log = JSON.parse(raw.slice(start, end+1)); }catch(e){ toast('That text could not be read. Copy the whole block from Claude, from the first { to the last }.', true); return; }
  const day = /^\d{4}-\d{2}-\d{2}$/.test(log.date||'') ? log.date : todayStr();
  const ops = [], problems = [];
  const newNames = (log.students||[]).map(s => String(s.name||'').trim().toLowerCase());
  const who = (name, label) => {
    const s = findStudentByName(name);
    if(!s && !newNames.includes(String(name||'').trim().toLowerCase())) problems.push(label+': no student named "'+name+'"');
    return s;
  };
  (log.students||[]).forEach(s => {
    if(findStudentByName(s.name)) return;
    ops.push({label:'New student: <b>'+esc(s.name)+'</b>', run:()=> apiPost({action:'add', tab:'Students', record:{'Student Name':s.name,'Parent Name':s.parent||'','Phone':s.phone||'','Email':s.email||'','Billing Type':s.billing||'Per Lesson','Lesson Rate':s.rate!=null?s.rate:setting('Default Lesson Rate',25),'Status':'Active','Start Date':day,'Notes':s.notes||''}})});
  });
  (log.lessons||[]).forEach(l => {
    const s = who(l.student, 'Lesson'); const status = ATT.includes(l.status) ? l.status : 'Attended';
    ops.push({label:'Lesson: <b>'+esc(l.student)+'</b> '+statusPill(status), run:()=>{
      const st = s || findStudentByName(l.student); if(!st) throw new Error('Student not found: '+l.student);
      const d = lessonDefaults(st['Student ID'], status);
      if(l.charge != null && l.charge !== '') { d['Amount Charged'] = Number(l.charge); d['Payment Owed'] = Number(l.charge) > 0 ? 'Yes' : 'No'; }
      if(l.makeup === true) d['Make-Up Owed'] = 'Yes'; if(l.makeup === false) d['Make-Up Owed'] = 'No';
      const mu = status==='Make-Up Lesson' ? openMakeups(st['Student ID'])[0] : null;
      return apiPost({action:'logLesson', record:Object.assign({'Date': l.date||day, 'Student ID': st['Student ID'], 'Status': status, 'Notes': l.notes||''}, d), makeupId: mu ? mu['Make-Up ID'] : ''});
    }});
  });
  (log.payments||[]).forEach(p => {
    const s = who(p.student, 'Payment');
    ops.push({label:'Payment: <b>'+esc(p.student)+'</b> <span class="credit">'+money(p.amount)+'</span> '+esc(p.method||''), run:()=>{
      const st = s || findStudentByName(p.student); if(!st) throw new Error('Student not found: '+p.student);
      return apiPost({action:'add', tab:'Payments', record:{'Date':p.date||day,'Student ID':st['Student ID'],'Amount':Number(p.amount)||0,'Method':METHODS.includes(p.method)?p.method:(p.method?'Other':''),'For':p.for||'','Notes':p.notes||''}});
    }});
  });
  (log.charges||[]).forEach(c => {
    const s = who(c.student, 'Charge');
    ops.push({label:'Charge: <b>'+esc(c.student)+'</b> '+esc(c.description||'')+' '+money(c.amount), run:()=>{
      const st = s || findStudentByName(c.student); if(!st) throw new Error('Student not found: '+c.student);
      return apiPost({action:'add', tab:'Charges', record:{'Date':c.date||day,'Student ID':st['Student ID'],'Description':c.description||'Charge','Amount':Number(c.amount)||0,'Notes':c.notes||''}});
    }});
  });
  (log.notes||[]).forEach(n => {
    const s = who(n.student, 'Note');
    ops.push({label:'Lesson note: <b>'+esc(n.student)+'</b>'+(n.piece?' &middot; '+esc(n.piece):''), run:()=>{
      const st = s || findStudentByName(n.student); if(!st) throw new Error('Student not found: '+n.student);
      return apiPost({action:'add', tab:'Lesson Notes', record:{'Date':n.date||day,'Student ID':st['Student ID'],'Current Piece':n.piece||'','What We Worked On':n.workedOn||'','Practice Next':n.practice||'','Notes':n.notes||''}});
    }});
  });
  (log.makeups||[]).forEach(m => {
    const s = who(m.student, 'Make-up');
    ops.push({label:'Make-up: <b>'+esc(m.student)+'</b> '+statusPill(m.status||'Owed')+(m.scheduledDate?' '+fmtDate(m.scheduledDate)+' '+esc(m.scheduledTime||''):''), run:()=>{
      const st = s || findStudentByName(m.student); if(!st) throw new Error('Student not found: '+m.student);
      const rec = {'Status':m.status||'Owed','Scheduled Date':m.scheduledDate||'','Scheduled Time':m.scheduledTime||'','Notes':m.notes||''};
      const open = openMakeups(st['Student ID'])[0];
      if(open && !m.missedDate) return apiPost({action:'update', tab:'Make-Ups', id:open['Make-Up ID'], record:rec});
      return apiPost({action:'add', tab:'Make-Ups', record:Object.assign({'Student ID':st['Student ID'],'Missed Date':m.missedDate||'','Reason':m.reason||''}, rec)});
    }});
  });
  IMPORT = { ops, day };
  $('#importPreview').innerHTML = '<h3>'+ops.length+' item'+(ops.length===1?'':'s')+' for '+fmtDate(day,true)+'</h3>' +
    (problems.length ? '<div class="card" style="border-color:var(--bad);margin-bottom:10px"><b class="owe">Fix these first</b><br>'+problems.map(esc).join('<br>')+'<div class="help">Spell the name the way it appears on your Students tab, or ask Claude to fix the block.</div></div>' : '') +
    '<div class="card">'+(ops.map(o => '<div style="padding:4px 0">'+o.label+'</div>').join('') || '<span class="muted">Nothing to save.</span>')+'</div>';
  $('#importSaveBtn').disabled = !ops.length || problems.length > 0;
}
async function importSave(){
  if(!IMPORT || !IMPORT.ops.length) return;
  const btn = $('#importSaveBtn');
  let done = 0;
  try{
    for(const op of IMPORT.ops){ btn.textContent = 'Saving '+(done+1)+' of '+IMPORT.ops.length+'...'; await op.run(); done++; }
    closeModal(); UI.day = IMPORT.day; toast('Saved all '+done+' items'); render();
  }catch(e){
    IMPORT.ops = IMPORT.ops.slice(done);
    toast('Saved '+done+', then stopped: '+e.message+'. Click Save all to try the remaining '+IMPORT.ops.length+'.', true);
    btn.textContent = 'Save remaining '+IMPORT.ops.length; btn.disabled = false;
  }
}

function noteForm(sid){
  const last = sid ? latestNote(sid) : null;
  openForm('Lesson Notes', null, { 'Date': VIEW==='today' ? UI.day : todayStr(), 'Student ID': sid || '', 'Current Piece': last ? last['Current Piece'] : '' },
    { intro: last && last['Practice Next'] ? '<b>Last assignment ('+fmtDate(last['Date'])+'):</b> '+esc(last['Practice Next']) : '' });
}
function payForm(sid){
  const b = sid ? ledger(sid).balance : 0;
  openForm('Payments', null, { 'Date': todayStr(), 'Student ID': sid||'', 'Amount': b>0 ? Number(b.toFixed(2)) : '', 'Method': '' },
    { intro: sid ? esc(sName(sid))+' currently '+(b>0.004 ? 'owes '+money(b) : (b<-0.004 ? 'has a credit of '+money(-b) : 'is paid up'))+'.' : '' });
}
function billMonthlyForm(){
  const ym = todayStr().slice(0,7);
  const monthly = activeStudents().filter(s => s['Billing Type']==='Monthly');
  openModal('<h2>Bill monthly tuition</h2><p>This adds one tuition charge for each <b>active monthly</b> student ('+monthly.length+' right now) at their monthly rate. Anyone already billed for that month is skipped, so it is safe to click twice.</p>' +
    '<label class="f"><span>Month</span><input type="month" id="billMonth" value="'+ym+'"></label>' +
    (monthly.length ? '<p class="help">'+monthly.map(s => esc(s['Student Name'])+' ('+money(s['Lesson Rate'])+')').join(', ')+'</p>' : '<p class="help">No active students are set to Monthly billing yet. Change a student\'s Billing Type to Monthly to use this.</p>') +
    '<div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="doBill" '+(monthly.length?'':'disabled')+'>Add charges</button></div>');
}

document.addEventListener('click', async ev => {
  const stop = ev.target.closest('[data-stop]');
  const t = ev.target.closest('[data-act],[data-edit],[data-view]');
  if(!t) { if(ev.target.id==='modal') closeModal(); return; }
  if(stop && stop !== t && t.tagName==='TR') return;
  if(t.dataset.view){ go(t.dataset.view); return; }
  if(t.dataset.edit){ ev.preventDefault(); closeModal(); openForm(t.dataset.edit, t.dataset.id); return; }
  const a = t.dataset.act;
  if(t.tagName==='A') ev.preventDefault();
  switch(a){
    case 'go': go(t.dataset.v); break;
    case 'close': closeModal(); break;
    case 'retry': load(); break;
    case 'calMode': UI.calMode = t.dataset.m; render(); break;
    case 'printSched': { const k = $('#prKind').value, d = $('#prDate').value || todayStr(); UI.printDate = d; closeModal();
      ({day:printDaySchedule, week:printWeekSchedule, month:printMonthSchedule, year:printYearSchedule})[k](d); break; }
    case 'printPage': closeModal(); printCurrent(); break;
    case 'printModal': printCurrent(); break;
    case 'printSchedOpen': openSchedulePrint(); break;
    case 'calShift': UI.calDay = addDays(weekStart(UI.calDay||todayStr()), Number(t.dataset.n)); render(); break;
    case 'calToday': UI.calDay = todayStr(); render(); break;
    case 'importDay': importForm(); break;
    case 'importCheck': importCheck(); break;
    case 'importSave': t.disabled = true; await importSave(); break;
    case 'add': openForm(t.dataset.tab, null, defaultsFor(t.dataset.tab)); break;
    case 'addFor': { const sid = t.dataset.sid; closeModal();
      const pre = Object.assign(defaultsFor(t.dataset.tab), {'Student ID': sid});
      if(t.dataset.tab === 'Mileage'){ const st = student(sid) || {}; pre['Purpose'] = 'Violin lesson - ' + (st['Student Name']||''); if(num(st['Miles Per Lesson']) > 0) pre['Miles'] = st['Miles Per Lesson']; }
      openForm(t.dataset.tab, null, pre, {reopenStudent: sid}); break; }
    case 'student': studentDetail(t.dataset.id); break;
    case 'log': t.disabled = true; await quickLog(t.dataset.sid, t.dataset.s); break;
    case 'logForm': openForm('Attendance', null, Object.assign({'Date': UI.day, 'Student ID': t.dataset.sid, 'Status': t.dataset.s}, lessonDefaults(t.dataset.sid, t.dataset.s)), {title:'Log cancellation', intro:'Check whether this lesson should be charged and whether a make-up is owed, then Save.'}); break;
    case 'muDone': t.disabled = true; await makeupDone(t.dataset.mu, t.dataset.sid); break;
    case 'note': closeModal(); noteForm(t.dataset.sid); break;
    case 'pay': closeModal(); payForm(t.dataset.sid); break;
    case 'dayShift': { const d = dateObj(UI.day); d.setDate(d.getDate() + Number(t.dataset.n)); UI.day = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); render(); break; }
    case 'dayToday': UI.day = todayStr(); render(); break;
    case 'muFilter': UI.muStatus = t.dataset.s; render(); break;
    case 'attAll': UI.attMonth = ''; render(); break;
    case 'expCat': UI.expCat = t.dataset.cat; render(); break;
    case 'expClear': UI.expCat = ''; UI.expQ = ''; render(); break;
    case 'saveMiles': { const el = document.getElementById('studentMiles'); saveMiles(t.dataset.sid, el ? el.value : '', t); break; }
    case 'payClear': UI.payQ = ''; UI.payStudent = ''; UI.payMonth = ''; UI.payMethod = ''; render(); break;
    case 'billMonthly': billMonthlyForm(); break;
    case 'doBill': {
      const ym = $('#billMonth').value; if(!ym) return;
      t.disabled = true;
      try{ const n = await apiPost({action:'billMonthly', date: ym+'-01', label: monthLabel(ym)}); closeModal(); toast(n ? 'Added '+n+' tuition charge'+(n===1?'':'s') : 'Everyone was already billed for that month'); render(); }
      catch(e){ toast(e.message, true); t.disabled = false; }
      break;
    }
    case 'del': {
      if(!confirm('Delete this '+SINGULAR[t.dataset.tab].toLowerCase()+'? This cannot be undone.')) return;
      try{ await apiPost({action:'delete', tab:t.dataset.tab, id:t.dataset.id}); closeModal(); toast('Deleted'); render(); }
      catch(e){ toast(e.message, true); }
      break;
    }
    case 'saveCfg': {
      const url = $('#cfgUrl').value.trim(), key = $('#cfgKey').value.trim();
      if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){ toast('The URL should start with https://script.google.com and end with /exec', true); return; }
      if(!key){ toast('Paste your Studio Key', true); return; }
      cfg.url = url; cfg.key = key; store.set('vs_url', url); store.set('vs_key', key);
      VIEW = 'today'; store.set('vs_view','today');
      await load(true);
      if(DATA) toast('Connected to your Google Sheet');
      else { VIEW = 'settings'; render(); }
      break;
    }
    case 'toggleKey': { const k = $('#cfgKey'); k.type = k.type==='password' ? 'text' : 'password'; t.textContent = k.type==='password' ? 'Show key' : 'Hide key'; break; }
  }
});

function defaultsFor(tab){
  const d = todayStr();
  return {
    'Students': {'Status':'Active','Billing Type':'Per Lesson','Start Date':d},
    'Schedule': {},
    'Attendance': {'Date': VIEW==='today' ? UI.day : d, 'Status':'Attended'},
    'Payments': {'Date': d},
    'Charges': {'Date': d},
    'Make-Ups': {'Status':'Owed'},
    'Lesson Notes': {'Date': d},
    'Mileage': {'Date': d, 'Rate': num(setting('Mileage Rate (per mile)', 0.76))},
    'Expenses': {'Date': d, 'Business Use %': 100}
  }[tab] || {};
}

function afterRender(){
  const on = (id, evt, fn) => { const el = document.getElementById(id); if(el) el.addEventListener(evt, fn); };
  on('dayPick','change', e => { if(e.target.value){ UI.day = e.target.value; render(); } });
  on('studentQ','input', e => { UI.studentQ = e.target.value; const pos = e.target.selectionStart; render(); const el = $('#studentQ'); el.focus(); el.setSelectionRange(pos,pos); });
  on('showInactive','change', e => { UI.showInactive = e.target.checked; render(); });
  on('attStudent','change', e => { UI.attStudent = e.target.value; render(); });
  on('attMonth','change', e => { UI.attMonth = e.target.value; render(); });
  on('payQ','input', e => { UI.payQ = e.target.value; const pos = e.target.selectionStart, y = window.scrollY; render(); window.scrollTo(0,y); const el = $('#payQ'); el.focus({preventScroll:true}); el.setSelectionRange(pos,pos); });
  on('payStudent','change', e => { UI.payStudent = e.target.value; render(); });
  on('payMonth','change', e => { UI.payMonth = e.target.value; render(); });
  on('payMethod','change', e => { UI.payMethod = e.target.value; render(); });
  on('expYear','change', e => { UI.expYear = e.target.value; render(); });
  on('expCat','change', e => { UI.expCat = e.target.value; render(); });
  on('expQ','input', e => { UI.expQ = e.target.value; const pos = e.target.selectionStart, y = window.scrollY; render(); window.scrollTo(0,y); const el = $('#expQ'); el.focus({preventScroll:true}); el.setSelectionRange(pos,pos); });
  on('mileYear','change', e => { UI.mileYear = e.target.value; render(); });
  on('mileStudent','change', e => { UI.mileStudent = e.target.value; render(); });
  document.querySelectorAll('.mplIn').forEach(el => {
    el.addEventListener('change', () => saveMiles(el.dataset.sid, el.value, el));
    el.addEventListener('keydown', e => { if(e.key === 'Enter') el.blur(); });
  });
  on('noteStudent','change', e => { UI.noteStudent = e.target.value; render(); });
}

$('#refreshBtn').addEventListener('click', () => load());
$('#printBtn').addEventListener('click', onPrintClick);
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && cfg.url && DATA) load(true); });
$('#view').addEventListener('focusout', () => setTimeout(() => { if(safeRender.pending) safeRender(); }, 0));
(function(){ const c = cfg.url && cfg.key ? cacheLoad() : null;
  if(c){ DATA = c.data; render(); $('#sync').textContent = 'Updating...'; } else render(); })();
load(true);
</script>
</body>
